<!DOCTYPE html>
<html>

<head>

<title>Flipkart Registration</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f1f3f6;
}

.container{

    width:400px;
    background:white;
    margin:50px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 15px gray;

}

h2{

    color:#2874F0;
    text-align:center;

}

input{

    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;

}

button{

    width:100%;
    padding:12px;
    margin-top:20px;
    background:#fb641b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#e85d04;

}

</style>

</head>

<body>

<div class="container">

<h2>Flipkart Registration</h2>

<form method="POST">

<input
type="text"
name="fullname"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="text"
name="mobile"
placeholder="Mobile Number"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Register
</button>

</form>

</div>

</body>

</html>
